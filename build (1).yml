name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Autopilot.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug -p Autopilot
      - uses: actions/upload-artifact@v4
        with:
          name: Autopilot-apk
          path: Autopilot/app/build/outputs/apk/debug/app-debug.apk
